[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "para-drugrank"
version = "0.1.0"
description = "PARA-DrugRank model training and evaluation"
requires-python = ">=3.12"
dependencies = ["numpy==1.26.4", "scipy==1.17.1", "scikit-learn==1.9.1", "joblib==1.6.0", "threadpoolctl==3.8.0"]

[tool.setuptools.packages.find]
where = ["source"]
